[project]
name = "halide_api"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "boto3>=1.42.97",
    "fastapi[standard]>=0.128.8",
    "psycopg[binary]>=3.2.13",
    "pydantic-settings>=2.11.0",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halide_api"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]
